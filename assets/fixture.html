<!doctype html><meta name=viewport content="width=device-width,initial-scale=1">
<style>body{margin:0;font:16px/24px sans-serif}.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.grid{display:flex;gap:24px;margin-top:32px}.card{flex:1;padding:16px;border:1px solid #ccc}
.card h3{font-size:20px;margin:0 0 8px}.card.odd{margin-left:3px}.card h3.off{font-size:22px}
.wide{width:1500px;height:10px;background:red}</style>
<div class=wrap><div class=grid>
<div class=card><h3>A</h3>text</div><div class=card><h3>B</h3>text<br>more<br>lines</div>
<div class="card odd"><h3 class=off>C</h3>text</div></div>
<div class=grid style="margin-top:37px"><div class=card><h3>D</h3></div><div class=card><h3>E</h3></div></div>
<div class=wide></div></div>
